apply plugin: 'com.android.application'

android {
    compileSdkVersion 25
    buildToolsVersion rootProject.buildToolsVersion
    defaultConfig {
        applicationId "com.testerkit"
        minSdkVersion 18
        targetSdkVersion 25
        versionCode 20180622
        versionName "2018.06.22"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // 将jar包打在test apk中，否则会无法启动测试
    androidTestCompile fileTree(dir: 'libs', include: ['*.jar'])

    //App test for UnitTest
    compile 'junit:junit:4.12'

    //App compatibility
    //compile 'com.android.support:appcompat-v7:25.3.1'

    // App dependencies
    compile 'com.android.support:support-annotations:' + rootProject.supportLibVersion;
    compile 'com.google.guava:guava:18.0'
    // Testing-only dependencies
    // Force usage of support annotations in the test app, since it is internally used by the runner module.
    androidTestCompile 'com.android.support:support-annotations:' + rootProject.supportLibVersion;
    androidTestCompile 'com.android.support.test:runner:' + rootProject.runnerVersion;
    androidTestCompile 'com.android.support.test:rules:' + rootProject.rulesVersion;
    // UiAutomator Testing
    androidTestCompile 'com.android.support.test.uiautomator:uiautomator-v18:' + rootProject.uiautomatorVersion;
    //androidTestCompile 'com.android.support.test.espresso:espresso-core:' + rootProject.espressoVersion;
}
