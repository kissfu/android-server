apply plugin: 'com.android.application'

android {

    //指定jdk版本,1.8解决编译rtc编译问题
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    compileSdkVersion 26
    //gradle自带编译工具
    //buildToolsVersion '28.0.2'
    defaultConfig {
        applicationId "com.testerkit"
        minSdkVersion 18
        targetSdkVersion 26
        versionCode 20180622
        versionName "2018.06.22"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        applicationVariants.all { variant ->
            variant.outputs.all {
                outputFileName = outputFileName.replace('debug.apk', "v${defaultConfig.versionName}.apk")
            }
        }

    }
    //解决编译错误
    lintOptions {
        abortOnError false
    }

    //统一设置了androidTest对应的内容，优先级最高
    sourceSets{
        main{
            jniLibs.srcDir 'libs'
            jni.srcDirs = []//disable automatic ndk-build call
        }
        androidTest{
            manifest.srcFile 'src/androidTestServer/AndroidManifest.xml'
        }
    }
    //for e2eTest flavors
    //纬度和app对应默认defaultConfig
    flavorDimensions 'default'
    productFlavors {
        //名字和目录对应
        e2eTest {
            testApplicationId 'com.testerkit.uia2.e2etest'
            //manifestPlaceholders = [suffix :'e2etest']
            //applicationId 'com.testerkit.uia2.e2etest'
        }
        server{
            testApplicationId 'com.testerkit.uia2.server'
            //manifestPlaceholders = [suffix :'server']
            //applicationId 'com.testerkit.uia2.server'
        }
    }
    //for e2eTest 使用默认的设置，可以使用Android Instrumented Tests测试
    testOptions {
        unitTests.returnDefaultValues = true
    }
}


dependencies {
    // libs
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //App test for UnitTest
    implementation 'junit:junit:4.12'

    //region App dependencies

    //App compatibility
    //compile 'com.android.support:appcompat-v7:25.3.1'
    implementation 'com.android.support:support-annotations:25.4.0'
    implementation 'com.android.support:appcompat-v7:26.1.0'
    implementation 'com.android.support.constraint:constraint-layout:1.0.2'
    implementation 'com.android.support:design:26.1.0'
    //endregion

    //region app for webRTC
    implementation 'com.android.support.test:runner:1.0.0'
    implementation 'com.android.support.test:rules:1.0.0'
    implementation 'com.android.support.test.uiautomator:uiautomator-v18:2.1.2'
    implementation project(':uia1')

    // https://mvnrepository.com/artifact/io.socket/socket.io-client/1.0.0
    implementation ('io.socket:socket.io-client:1.0.0') {
        //(排除) excluding org.json which is provided by Android
        //老版本：compile 'com.github.nkzawa:socket.io-client:0.4.2'
        exclude group: 'org.json', module: 'json'
    }

    //endregion webRTC

    //region AndroidTest server

    //compile 'com.google.guava:guava:18.0'
    // Testing-only dependencies
    // Force usage of support annotations in the test app, since it is internally used by the runner module.
    androidTestImplementation 'com.android.support:support-annotations:25.4.0'
    androidTestImplementation 'com.android.support.test:runner:1.0.0'
    androidTestImplementation 'com.android.support.test:rules:1.0.0'
    // UiAutomator Testing
    androidTestImplementation 'com.android.support.test.uiautomator:uiautomator-v18:2.1.2'
    //androidTestCompile 'com.android.support.test.espresso:espresso-core:' + rootProject.espressoVersion;
    androidTestImplementation project(':uia1')
    //endregion
}


